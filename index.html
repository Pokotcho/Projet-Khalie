<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>Welcome to Tauri</h1>

      <div class="row">
        <a href="https://vite.dev" target="_blank">
          <img src="/src/assets/vite.svg" class="logo vite" alt="Vite logo" />
        </a>
        <a href="https://tauri.app" target="_blank">
          <img
            src="/src/assets/tauri.svg"
            class="logo tauri"
            alt="Tauri logo"
          />
        </a>
        <a href="https://www.typescriptlang.org/docs" target="_blank">
          <img
            src="/src/assets/typescript.svg"
            class="logo typescript"
            alt="typescript logo"
          />
        </a>
      </div>
      <p>Click on the Tauri logo to learn more about the framework</p>

      <form class="row" id="greet-form">
        <input id="greet-input" placeholder="Enter a name..." />
        <button type="submit">Greet</button>
      </form>
      <p id="greet-msg"></p>

      <hr />
      <h2>Test de l'interrupteur</h2>
      <label>
        <input type="checkbox" id="feature-toggle" />
        Fonction activée
      </label>
      <p>Compteur reçu de Rust : <strong id="tick-value">-</strong></p>

      <hr />
      <h2>Connexion Twitch</h2>
      <button id="twitch-login-btn">Se connecter avec Twitch</button>
      <button id="twitch-logout-btn">Se déconnecter</button>
      <p id="twitch-status">Non connecté</p>
      <p id="twitch-code" style="display: none">
        Si le navigateur ne s'ouvre pas :
        <a href="#" id="twitch-link">ouvrir la page d'autorisation</a><br />
        Code : <strong id="twitch-usercode"></strong>
      </p>
      
    </main>
  </body>
</html>
