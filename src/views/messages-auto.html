<section id="auto-section" hidden>
  <div class="card">
    <h2>Messages automatiques</h2>
    <label class="switch-row">
      <input type="checkbox" id="auto-enabled" />
      <strong>Messages automatiques actifs</strong>
    </label>
    <p class="hint">Stream : <strong id="live-state">hors ligne</strong></p>
    <div class="field-row">
      <label class="field">
        <input type="checkbox" id="auto-only-live" />
        Seulement quand le stream est en direct
      </label>
      <label class="field">
        Messages dans le chat depuis le dernier message auto :
        <input type="number" id="auto-min-lines" min="0" max="100" />
      </label>
      <label class="field">
        Écart minimal entre deux messages (min) :
        <input type="number" id="auto-min-gap" min="0" max="60" />
      </label>
    </div>
    <button id="auto-save-settings">Enregistrer les réglages</button>
    <p id="auto-status" class="hint"></p>
    <p class="hint">Champ utilisable dans les textes : <code>[compteur]</code>.</p>
  </div>

  <div id="auto-list"></div>

  <div class="card">
    <h2>Ajouter un message automatique</h2>
    <div class="field-row">
      <label class="field">
        Nom :
        <input id="auto-new-name" placeholder="Rappel Discord" maxlength="40" />
      </label>
      <label class="field">
        Toutes les (minutes) :
        <input type="number" id="auto-new-interval" min="5" max="1440" value="30" />
      </label>
    </div>
    <textarea
      id="auto-new-text"
      rows="2"
      maxlength="500"
      placeholder="Texte envoyé dans le chat"
      class="auto-textarea"
    ></textarea>
    <button id="auto-new-add">Ajouter le message</button>
  </div>
</section>
