<section class="card" id="chat-section" hidden>
  <h2>Chat Twitch</h2>
  <p id="chat-status" class="hint">Chat : arrêté</p>
  <div id="chat-log" class="chat-log"></div>

  <div class="send-row">
    <select id="send-as" title="Compte utilisé pour écrire">
      <option value="bot">Écrire en tant que BOT</option>
      <option value="streamer">Écrire en tant que STREAMER</option>
    </select>
    <input id="send-input" placeholder="Message à envoyer" maxlength="500" />
    <button id="send-btn">Envoyer</button>
  </div>
  <p id="send-status" class="hint"></p>
</section>
